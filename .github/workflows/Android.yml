name: 构建 Android

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android"
        required: false
        default: true
        type: boolean
      build_number:
        description: "Build number；0 = 自动"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: 检查构建条件
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if [[ ! "${BUILD_NUMBER}" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "Build number 必须是 0 或正整数。"
            exit 1
          fi

  android:
    name: Android
    needs: validate
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Apply media_kit Android decoder lab hook
        shell: pwsh
        run: lib/scripts/patch_media_kit_android_decoder_lab.ps1

      - name: Write fixed Android signing key
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$SIGN_KEYSTORE_BASE64" || { echo "Missing SIGN_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          {
            echo storeFile='key.jks'
            echo storePassword="$KEYSTORE_PASSWORD"
            echo keyAlias="$KEY_ALIAS"
            echo keyPassword="$KEY_PASSWORD"
          } > android/key.properties

      - name: Set and Extract version
        shell: pwsh
        env:
          BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}
          RELEASE_TAG_OVERRIDE: ""
        run: lib/scripts/build.ps1 android

      - name: Build Android
        shell: bash
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub

      - name: Rename
        shell: bash
        run: |
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
            mv "$file" "PiliBro_android_${{ env.version }}_${abi}.apk"
          done

      - name: Upload Android
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: PiliBro_android_*.apk
          if-no-files-found: error
          retention-days: 7
