name: PiliBro编译IOS

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number；0 = 自动"
        required: false
        default: "0"
        type: string
      tag:
        description: "Release tag；留空则只构建（用于版本号推导）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: 检查构建条件
    runs-on: ubuntu-latest
    steps:
      - name: Validate build number
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if [[ ! "${BUILD_NUMBER}" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "Build number 必须是 0 或正整数。"
            exit 1
          fi

  ios:
    name: iOS
    needs: validate
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync BroTech companion files
        if: ${{ inputs.tag != '' }}
        shell: bash
        run: tool/sync_brotech.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: ${{ inputs.tag == '' }}

      - name: Set and Extract version
        shell: pwsh
        env:
          BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}
          RELEASE_TAG_OVERRIDE: ${{ inputs.tag }}
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: Build iOS
        shell: bash
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub
          ln -sf ./build/ios/iphoneos Payload
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -r9 "PiliBro_ios_${{ env.version }}.ipa" Payload/Runner.app

      - name: Upload iOS
        uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: PiliBro_ios_*.ipa
          if-no-files-found: error
          retention-days: 7